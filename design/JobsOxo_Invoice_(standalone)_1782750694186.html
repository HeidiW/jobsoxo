document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"802ae5f4-d2a5-4e59-9c6b-457551bb8cf5\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n*{box-sizing:border-box;}\nbody{margin:0;}\ninput,select,textarea{font-family:inherit;}\ntextarea{resize:vertical;}\n::-webkit-scrollbar{width:11px;height:11px;}\n::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:3px solid transparent;background-clip:padding-box;}\ninput[type=number]::-webkit-inner-spin-button{opacity:.35;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;flex-direction:column;height:100vh;background:#f1f5f9;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#0f172a;\">\n\n  <header style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 22px;background:#ffffff;border-bottom:1px solid #e2e8f0;flex-shrink:0;z-index:20;\">\n    <div style=\"display:flex;align-items:center;gap:11px;min-width:170px;\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:#2563eb;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;\">J<\u002Fdiv>\n      <div>\n        <div style=\"font-size:15px;font-weight:800;letter-spacing:-.01em;\">JobsOxo<\u002Fdiv>\n        <div style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-top:1px;\">Create Invoice<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:3px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:11px;padding:4px;\">\n      <button onclick=\"{{ onSplit }}\" style=\"{{ splitBtnStyle }}\">Split view<\u002Fbutton>\n      <button onclick=\"{{ onTabbed }}\" style=\"{{ tabbedBtnStyle }}\">Tabbed<\u002Fbutton>\n      <button onclick=\"{{ onBuilder }}\" style=\"{{ builderBtnStyle }}\">Builder<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:9px;min-width:170px;justify-content:flex-end;\">\n      <button style=\"padding:8px 14px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;font-size:13px;font-weight:700;color:#475569;cursor:pointer;font-family:inherit;\">Save draft<\u002Fbutton>\n      <button style=\"padding:8px 16px;border:none;background:#2563eb;border-radius:9px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;\" style-hover=\"background:#1d4ed8;\">Send invoice<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"display:flex;align-items:center;gap:12px;padding:9px 22px;background:#eff6ff;border-bottom:1px solid #dbeafe;flex-shrink:0;\">\n    <span style=\"width:8px;height:8px;border-radius:2px;background:#2563eb;flex-shrink:0;\"><\u002Fspan>\n    <span style=\"font-size:12.5px;color:#1e40af;font-weight:600;\">Import a PDF quote or invoice to auto-fill parties, sections and line items.<\u002Fspan>\n    <button style=\"margin-left:auto;padding:6px 13px;border:1px solid #93c5fd;background:#fff;border-radius:8px;font-size:12.5px;font-weight:700;color:#1d4ed8;cursor:pointer;font-family:inherit;\">Choose PDF<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"{{ bodyGridStyle }}\">\n\n    <div style=\"overflow-y:auto;padding:20px 22px 70px;border-right:1px solid #e2e8f0;\">\n\n      <sc-if value=\"{{ isTabbed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:4px;margin-bottom:16px;position:sticky;top:-20px;z-index:8;\">\n          <button onclick=\"{{ onSubDetails }}\" style=\"{{ subDetailsStyle }}\">1 · Details<\u002Fbutton>\n          <button onclick=\"{{ onSubItems }}\" style=\"{{ subItemsStyle }}\">2 · Line items<\u002Fbutton>\n          <button onclick=\"{{ onSubTotals }}\" style=\"{{ subTotalsStyle }}\">3 · Totals &amp; deposit<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showDetails }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:16px;\">\n\n          <section style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;\">\n              <span style=\"width:6px;height:16px;border-radius:3px;background:#2563eb;\"><\u002Fspan>\n              <h3 style=\"margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;\">From — your business<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px;\">\n              <div style=\"grid-column:1/-1;\">\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Business name<\u002Flabel>\n                <input value=\"{{ from.name }}\" onchange=\"{{ onFromName }}\" placeholder=\"Your company\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;font-weight:700;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n              <\u002Fdiv>\n              <div style=\"grid-column:1/-1;\">\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Address<\u002Flabel>\n                <textarea rows=\"2\" value=\"{{ from.address }}\" onchange=\"{{ onFromAddress }}\" placeholder=\"Street, city, state, ZIP\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;line-height:1.5;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <div>\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Email<\u002Flabel>\n                <input value=\"{{ from.email }}\" onchange=\"{{ onFromEmail }}\" placeholder=\"you@business.com\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Phone<\u002Flabel>\n                <input value=\"{{ from.phone }}\" onchange=\"{{ onFromPhone }}\" placeholder=\"(000) 000-0000\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n              <\u002Fdiv>\n              <div style=\"grid-column:1/-1;\">\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Business notes<\u002Flabel>\n                <textarea rows=\"2\" value=\"{{ fromNotes }}\" onchange=\"{{ onFromNotes }}\" placeholder=\"License #, insurance, certifications shown under your name\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;color:#475569;background:#f8fafc;line-height:1.5;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;background:#fff;\"><\u002Ftextarea>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;\">\n            <section style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;\">\n                <span style=\"width:6px;height:16px;border-radius:3px;background:#0ea5e9;\"><\u002Fspan>\n                <h3 style=\"margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;\">Bill to — client<\u002Fh3>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                <div>\n                  <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Client / company<\u002Flabel>\n                  <input value=\"{{ billTo.name }}\" onchange=\"{{ onBillName }}\" placeholder=\"Client name\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;font-weight:600;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Attention to<\u002Flabel>\n                  <input value=\"{{ billTo.attn }}\" onchange=\"{{ onBillAttn }}\" placeholder=\"Contact name\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Billing address<\u002Flabel>\n                  <textarea rows=\"2\" value=\"{{ billTo.address }}\" onchange=\"{{ onBillAddress }}\" placeholder=\"Street, city, state, ZIP\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;line-height:1.5;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\"><\u002Ftextarea>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <section style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;\">\n                <span style=\"width:6px;height:16px;border-radius:3px;background:#14b8a6;\"><\u002Fspan>\n                <h3 style=\"margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;\">Project / site<\u002Fh3>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                <div>\n                  <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Project / job name<\u002Flabel>\n                  <input value=\"{{ project.name }}\" onchange=\"{{ onProjName }}\" placeholder=\"Job name\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;font-weight:600;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Site location<\u002Flabel>\n                  <textarea rows=\"2\" value=\"{{ project.location }}\" onchange=\"{{ onProjLocation }}\" placeholder=\"Where the work happens\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;line-height:1.5;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\"><\u002Ftextarea>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n\n          <section style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px;\">\n              <span style=\"width:6px;height:16px;border-radius:3px;background:#6366f1;\"><\u002Fspan>\n              <h3 style=\"margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;\">Invoice details<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px;\">\n              <div>\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Invoice #<\u002Flabel>\n                <input value=\"{{ invoiceNumber }}\" onchange=\"{{ onInvNum }}\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;font-family:ui-monospace,Menlo,monospace;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Invoice date<\u002Flabel>\n                <input type=\"date\" value=\"{{ invoiceDate }}\" onchange=\"{{ onInvDate }}\" style=\"width:100%;padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Due date<\u002Flabel>\n                <input type=\"date\" value=\"{{ dueDate }}\" onchange=\"{{ onDueDate }}\" style=\"width:100%;padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;\">\n              <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Scope summary / notes<\u002Flabel>\n              <textarea rows=\"2\" value=\"{{ notes }}\" onchange=\"{{ onNotes }}\" placeholder=\"Summary line shown at the top of the invoice\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;line-height:1.5;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;\">\n              <label style=\"display:block;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;\">Presented to / recipients<\u002Flabel>\n              <input value=\"{{ presentedTo }}\" onchange=\"{{ onPresented }}\" placeholder=\"Names and company the invoice is presented to\" style=\"width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13.5px;color:#0f172a;background:#fff;\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none;\">\n            <\u002Fdiv>\n          <\u002Fsection>\n\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showItems }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);margin-bottom:16px;\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;\">\n            <span style=\"width:6px;height:16px;border-radius:3px;background:#2563eb;\"><\u002Fspan>\n            <h3 style=\"margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;\">Line items<\u002Fh3>\n            <span style=\"margin-left:auto;font-size:12px;color:#94a3b8;font-weight:600;\">Grouped by section · subtotals update live<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ secs }}\" as=\"sec\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid #f1f5f9;padding-top:6px;margin-top:6px;\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:8px 2px;\">\n                <button onclick=\"{{ sec.onToggle }}\" style=\"border:none;background:none;cursor:pointer;font-size:12px;color:#64748b;width:18px;padding:0;\">{{ sec.chevron }}<\u002Fbutton>\n                <input value=\"{{ sec.title }}\" onchange=\"{{ sec.onTitle }}\" style=\"flex:1;border:1px solid transparent;background:none;font-size:14px;font-weight:800;color:#0f172a;padding:5px 6px;border-radius:6px;\" style-focus=\"border-color:#cbd5e1;background:#fff;outline:none;\">\n                <span style=\"font-size:13px;color:#0f172a;font-weight:700;font-family:ui-monospace,Menlo,monospace;\">{{ sec.subtotalFmt }}<\u002Fspan>\n                <button onclick=\"{{ sec.onDel }}\" title=\"Remove section\" style=\"border:none;background:#f8fafc;color:#94a3b8;cursor:pointer;width:26px;height:26px;border-radius:7px;font-size:13px;\" style-hover=\"background:#fee2e2;color:#dc2626;\">×<\u002Fbutton>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ sec.open }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;padding:2px 2px 10px;\">\n priming & satin paint — walls, trim, doors (taped paint lines)', refs: 'PT-09 · PT-01B · PT-1', qty: 1, unit: 'lump', rate: 48500, notes: '' },\n        { id: 'i3', description: 'Rolled primer & paint — skimmed ceilings', refs: 'PT-01A · RCP-102', qty: 1, unit: 'lump', rate: 13200, notes: '' },\n        { id: 'i4', description: 'Faux beams — sand, prime & 2 finish coats throughout', refs: 'PT-01A · ID-202,203', qty: 1, unit: 'lump', rate: 14000, notes: '' }\n      ] },\n      { id: 's2', title: 'Ground floor — ceilings', collapsed: false, items: [\n        { id: 'i5', description: 'Ceilings, crown & GWB — Bar, Dining, Épicerie, Entry/Lobby (crown prepped, filled & caulked at GWB joins)', refs: 'PT-01C', qty: 1, unit: 'lump', rate: 56000, notes: '' }\n      ] },\n      { id: 's3', title: 'Ground floor — walls & trim', collapsed: false, items: [\n        { id: 'i6', description: 'Speakeasy — walls, trim, base, door casings, picture rails', refs: 'PT-05 · PT-07', qty: 1, unit: 'lump', rate: 25000, notes: '' },\n        { id: 'i7', description: 'Speakeasy ceiling — red flat', refs: 'PT-06', qty: 1, unit: 'lump', rate: 4000, notes: '' },\n        { id: 'i8', description: 'Stairway walls', refs: 'PT-01C', qty: 1, unit: 'lump', rate: 4800, notes: '' },\n        { id: 'i9', description: 'Coat room — spray walls, ceiling, trim & door', refs: 'PT-03', qty: 1, unit: 'lump', rate: 8400, notes: '' },\n        { id: 'i10', description: 'Bar walls (skim)', refs: 'PT-01B · PT-08', qty: 1, unit: 'lump', rate: 12000, notes: '' },\n        { id: 'i11', description: 'ADA bathroom — walls, ceiling & trim (spray)', refs: '—', qty: 1, unit: 'lump', rate: 9600, notes: '' },\n        { id: 'i12', description: 'Elevator corridor — walls & trim', refs: 'PT-01B · PT-02', qty: 1, unit: 'lump', rate: 10600, notes: '' },\n        { id: 'i13', description: 'Open kitchen — walls & trim', refs: 'PT-01B · PT-02', qty: 1, unit: 'lump', rate: 6800, notes: '' }\n      ] },\n      { id: 's4', title: 'Exterior', collapsed: false, items: [\n        { id: 'i14', description: 'Exterior — sprayed semi-gloss', refs: 'PT-08', qty: 1, unit: 'lump', rate: 9000, notes: '' }\n      ] }\n    ]\n  };\n  _sid = 100;\n  _iid = 1000;\n\n  num(v) { return Number(v) || 0; }\n\n  setTop(key) { return (e) => this.setState({ [key]: e.target.value }); }\n  setObj(obj, key) { return (e) => { const v = e.target.value; this.setState((s) => ({ [obj]: { ...s[obj], [key]: v } })); }; }\n\n  updItem(sid, iid, field) {\n    return (e) => {\n      const val = e.target.value;\n      this.setState((s) => ({\n        sections: s.sections.map((sec) => sec.id !== sid ? sec : {\n          ...sec, items: sec.items.map((it) => it.id !== iid ? it : { ...it, [field]: val })\n        })\n      }));\n    };\n  }\n  addItem(sid) {\n    return () => this.setState((s) => ({\n      sections: s.sections.map((sec) => sec.id !== sid ? sec : {\n        ...sec, collapsed: false,\n        items: [...sec.items, { id: 'i' + (this._iid++), description: '', refs: '', qty: 1, unit: 'lump', rate: 0, notes: '' }]\n      })\n    }));\n  }\n  delItem(sid, iid) {\n    return () => this.setState((s) => ({\n      sections: s.sections.map((sec) => sec.id !== sid ? sec : { ...sec, items: sec.items.filter((it) => it.id !== iid) })\n    }));\n  }\n  setSecTitle(sid) { return (e) => { const v = e.target.value; this.setState((s) => ({ sections: s.sections.map((sec) => sec.id !== sid ? sec : { ...sec, title: v }) })); }; }\n  toggleSec(sid) { return () => this.setState((s) => ({ sections: s.sections.map((sec) => sec.id !== sid ? sec : { ...sec, collapsed: !sec.collapsed }) })); }\n  delSec(sid) { return () => this.setState((s) => ({ sections: s.sections.filter((sec) => sec.id !== sid) })); }\n  addSection() { this.setState((s) => ({ sections: [...s.sections, { id: 's' + (this._sid++), title: 'New section', collapsed: false, items: [] }] })); }\n\n  segStyle(active, color) {\n    return {\n      padding: '7px 15px', borderRadius: '8px', border: 'none', cursor: 'pointer',\n      fontSize: '13px', fontWeight: 700, fontFamily: 'inherit', whiteSpace: 'nowrap',\n      transition: 'all .15s',\n      background: active ? (color || '#2563eb') : 'transparent',\n      color: active ? '#ffffff' : '#475569',\n      boxShadow: active ? '0 1px 2px rgba(15,23,42,.12)' : 'none'\n    };\n  }\n  subStyle(active) {\n    return {\n      flex: 1, padding: '8px 10px', borderRadius: '8px', border: 'none', cursor: 'pointer',\n      fontSize: '12.5px', fontWeight: 700, fontFamily: 'inherit',\n      background: active ? '#2563eb' : 'transparent',\n      color: active ? '#ffffff' : '#64748b'\n    };\n  }\n  miniStyle(active) {\n    return {\n      flex: 1, padding: '6px 8px', borderRadius: '6px', border: 'none', cursor: 'pointer',\n      fontSize: '12px', fontWeight: 700, fontFamily: 'inherit',\n      background: active ? '#ffffff' : 'transparent',\n      color: active ? '#2563eb' : '#64748b',\n      boxShadow: active ? '0 1px 2px rgba(15,23,42,.1)' : 'none'\n    };\n  }\n\n  fmtDate(d) {\n    if (!d) return '—';\n    const dt = new Date(d + 'T00:00:00');\n    if (isNaN(dt.getTime())) return d;\n    return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const cur = this.props.currency ?? '$';\n    const showRefs = this.props.showReferenceCodes ?? true;\n    const opt = s.activeOption ?? this.props.defaultView ?? 'split';\n    const isTabbed = opt === 'tabbed';\n\n    const fmt = (n) => cur + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });\n\n    let subtotal = 0;\n    const secs = s.sections.map((sec) => {\n      let st = 0;\n      const items = sec.items.map((it) => {\n        const amt = this.num(it.qty) * this.num(it.rate);\n        st += amt;\n        return {\n          ...it,\n          amountFmt: fmt(amt),\n          qtyLabel: it.unit === 'lump' ? '—' : (it.qty + ' ' + it.unit),\n          hasNotes: !!(it.notes && String(it.notes).trim()),\n          showRefsLine: showRefs && !!(it.refs && String(it.refs).trim() && it.refs !== '—'),\n          onDesc: this.updItem(sec.id, it.id, 'description'),\n          onRefs: this.updItem(sec.id, it.id, 'refs'),\n          onQty: this.updItem(sec.id, it.id, 'qty'),\n          onUnit: this.updItem(sec.id, it.id, 'unit'),\n          onRate: this.updItem(sec.id, it.id, 'rate'),\n          onNotes: this.updItem(sec.id, it.id, 'notes'),\n          onDel: this.delItem(sec.id, it.id)\n        };\n      });\n      subtotal += st;\n      return {\n        ...sec,\n        open: !sec.collapsed,\n        chevron: sec.collapsed ? '▸' : '▾',\n        subtotalFmt: fmt(st),\n        items,\n        onTitle: this.setSecTitle(sec.id),\n        onAdd: this.addItem(sec.id),\n        onToggle: this.toggleSec(sec.id),\n        onDel: this.delSec(sec.id)\n      };\n    });\n\n    const taxPct = this.num(s.taxRate);\n    const tax = subtotal * taxPct / 100;\n    const total = subtotal + tax;\n    const deposit = s.depositMode === 'percent' ? total * this.num(s.depositPct) / 100 : this.num(s.depositAmt);\n    const balance = total - deposit;\n    const depPctOfTotal = total > 0 ? Math.round(deposit / total * 1000) / 10 : 0;\n\n    return {\n      opt, isTabbed,\n      showDetails: !isTabbed || s.subTab === 'details',\n      showItems: !isTabbed || s.subTab === 'items',\n      showTotals: !isTabbed || s.subTab === 'totals',\n      showRefs,\n\n      bodyGridStyle: {\n        display: 'grid',\n        gridTemplateColumns: opt === 'builder' ? '1.55fr 1fr' : '1fr 1fr',\n        flex: 1, minHeight: 0\n      },\n\n      splitBtnStyle: this.segStyle(opt === 'split'),\n      tabbedBtnStyle: this.segStyle(opt === 'tabbed'),\n      builderBtnStyle: this.segStyle(opt === 'builder'),\n      onSplit: () => this.setState({ activeOption: 'split' }),\n      onTabbed: () => this.setState({ activeOption: 'tabbed' }),\n      onBuilder: () => this.setState({ activeOption: 'builder' }),\n\n      subDetailsStyle: this.subStyle(s.subTab === 'details'),\n      subItemsStyle: this.subStyle(s.subTab === 'items'),\n      subTotalsStyle: this.subStyle(s.subTab === 'totals'),\n      onSubDetails: () => this.setState({ subTab: 'details' }),\n      onSubItems: () => this.setState({ subTab: 'items' }),\n      onSubTotals: () => this.setState({ subTab: 'totals' }),\n\n      from: s.from, fromNotes: s.fromNotes, billTo: s.billTo, project: s.project,\n      invoiceNumber: s.invoiceNumber, invoiceDate: s.invoiceDate, dueDate: s.dueDate,\n      invoiceDateFmt: this.fmtDate(s.invoiceDate), dueDateFmt: this.fmtDate(s.dueDate),\n      presentedTo: s.presentedTo, paymentTerms: s.paymentTerms, paymentMethod: s.paymentMethod,\n      notes: s.notes, hasNotes: !!(s.notes && s.notes.trim()), taxRate: s.taxRate,\n\n      onFromName: this.setObj('from', 'name'),\n      onFromAddress: this.setObj('from', 'address'),\n      onFromEmail: this.setObj('from', 'email'),\n      onFromPhone: this.setObj('from', 'phone'),\n      onFromNotes: this.setTop('fromNotes'),\n      onBillName: this.setObj('billTo', 'name'),\n      onBillAttn: this.setObj('billTo', 'attn'),\n      onBillAddress: this.setObj('billTo', 'address'),\n      onProjName: this.setObj('project', 'name'),\n      onProjLocation: this.setObj('project', 'location'),\n      onInvNum: this.setTop('invoiceNumber'),\n      onInvDate: this.setTop('invoiceDate'),\n      onDueDate: this.setTop('dueDate'),\n      onPresented: this.setTop('presentedTo'),\n      onTerms: this.setTop('paymentTerms'),\n      onMethod: this.setTop('paymentMethod'),\n      onNotes: this.setTop('notes'),\n      onTax: this.setTop('taxRate'),\n\n      secs,\n      onAddSection: () => this.addSection(),\n\n      subtotalFmt: fmt(subtotal),\n      taxLabel: taxPct > 0 ? '(' + taxPct + '%)' : '',\n      taxFmt: fmt(tax),\n      totalFmt: fmt(total),\n      depositFmt: fmt(deposit),\n      balanceFmt: fmt(balance),\n      depositPctLabel: '(' + depPctOfTotal + '%)',\n\n      modePctStyle: this.miniStyle(s.depositMode === 'percent'),\n      modeFixedStyle: this.miniStyle(s.depositMode === 'fixed'),\n      onModePct: () => this.setState({ depositMode: 'percent' }),\n      onModeFixed: () => this.setState({ depositMode: 'fixed' }),\n      depositInputLabel: s.depositMode === 'percent' ? 'Deposit (%)' : 'Deposit amount',\n      depositInputValue: s.depositMode === 'percent' ? s.depositPct : s.depositAmt,\n      onDepChange: s.depositMode === 'percent' ? this.setTop('depositPct') : this.setTop('depositAmt')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
