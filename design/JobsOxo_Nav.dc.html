<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:248px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;">
  <div style="padding:18px 16px;display:flex;align-items:center;gap:11px;">

    </div>
    <div style="display:flex;flex-direction:column;">
      <span style="font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--fg);">JobsOxo</span>
      <span style="font-size:11px;color:var(--faint);">Invoicing</span>
    </div>
  </div>

  <div style="padding:6px 12px;">
    <div style="font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:10px 10px 6px;">Main Menu</div>

    <a href="JobsOxo Dashboard.dc.html" class="navitem" style="{{ sDashboard }}">

      Dashboard
    </a>
    <a href="JobsOxo Clients.dc.html" class="navitem" style="{{ sClients }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iClients }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Clients
    </a>
    <a href="JobsOxo Jobs.dc.html" class="navitem" style="{{ sJobs }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iJobs }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
      Jobs
    </a>
    <a href="JobsOxo Invoices.dc.html" class="navitem" style="{{ sInvoices }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iInvoices }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      Invoices
    </a>
    <a href="JobsOxo Change Orders.dc.html" class="navitem" style="{{ sChange }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iChange }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      Change Orders
    </a>
    <a href="JobsOxo Scheduling.dc.html" class="navitem" style="{{ sScheduling }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iScheduling }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      Scheduling
    </a>
    <a href="JobsOxo Payroll.dc.html" class="navitem" style="{{ sPayroll }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iPayroll }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      Payroll
    </a>
    <a href="JobsOxo Inbox Tasks.dc.html" class="navitem" style="{{ sInbox }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iInbox }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      Inbox Tasks
      <span class="mono" style="margin-left:auto;background:var(--primary);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;">3</span>
    </a>
    <a href="JobsOxo Settings.dc.html" class="navitem" style="{{ sSettings }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ iSettings }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      Settings
    </a>
  </div>

  <div style="margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);">
    <a href="JobsOxo Settings.dc.html" class="navitem" style="display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:8px;margin:-4px;padding:4px;">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">CF</div>
      <div style="display:flex;flex-direction:column;min-width:0;">
        <span style="font-size:13px;font-weight:600;color:var(--fg);">Conor Foy</span>
        <span style="font-size:11px;color:var(--faint);">Signed in</span>
      </div>
    </a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;active&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dashboard&quot;, &quot;clients&quot;, &quot;jobs&quot;, &quot;invoices&quot;, &quot;change-orders&quot;, &quot;scheduling&quot;, &quot;payroll&quot;, &quot;inbox&quot;, &quot;settings&quot;], &quot;default&quot;: &quot;dashboard&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const base = 'display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:13.5px;text-decoration:none;margin-bottom:2px;';
    const idle = base + 'color:var(--muted);font-weight:500;';
    const on = base + 'background:var(--activeitem);color:var(--fg);font-weight:600;box-shadow:0 1px 2px var(--activeshadow);';
    const out = {};
    const keys = {
      sDashboard: 'dashboard', sClients: 'clients', sJobs: 'jobs', sInvoices: 'invoices',
      sChange: 'change-orders', sScheduling: 'scheduling', sPayroll: 'payroll', sInbox: 'inbox', sSettings: 'settings'
    };
    const iconKeys = {
      iDashboard: 'dashboard', iClients: 'clients', iJobs: 'jobs', iInvoices: 'invoices',
      iChange: 'change-orders', iScheduling: 'scheduling', iPayroll: 'payroll', iInbox: 'inbox', iSettings: 'settings'
    };
    for (const k in keys) {
      const isActive = keys[k] === active;
      out[k] = (isActive ? on : idle) + (keys[k] === 'settings' ? 'margin-top:6px;' : '');
    }
    for (const k in iconKeys) {
      out[k] = iconKeys[k] === active ? 'var(--primary)' : 'currentColor';
    }
    return out;
  }
}
</script>
</body>
</html>
