<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.navitem:hover{background:var(--navhover) !important;}
.card:hover{box-shadow:0 4px 14px rgba(15,23,41,.12) !important;transform:translateY(-1px);}
.darkmode{
  --app-bg:#0f1729 !important; --sidebar:#1a2336 !important; --border:#243049 !important; --panel:#141d30 !important; --panel-bd:#243049 !important;
  --fg:#f1f5f9 !important; --muted:#9aa6bd !important; --faint:#7c8aa3 !important; --primary:#3b82f6 !important; --soft:#1c2a44 !important;
  --track:#1a2336 !important; --navhover:#222e4a !important; --topbar:rgba(20,29,48,.72) !important;
  --activeitem:#222e4a !important; --activeshadow:rgba(0,0,0,.3) !important; --colhead:#10192b !important;
  --bl-bg:rgba(59,130,246,.16) !important; --bl-fg:#93b4fb !important; --bl-bd:rgba(59,130,246,.4) !important;
  --gr-bg:rgba(21,163,90,.16) !important; --gr-fg:#6cd49d !important; --gr-bd:rgba(21,163,90,.4) !important;
  --pu-bg:rgba(124,58,237,.18) !important; --pu-fg:#b794f4 !important; --pu-bd:rgba(124,58,237,.45) !important;
  --am-bg:rgba(224,160,32,.16) !important; --am-fg:#e7be73 !important; --am-bd:rgba(224,160,32,.4) !important;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#9aa3b266;border-radius:8px;border:3px solid transparent;background-clip:padding-box;}
</style>
</helmet>

<div class="{{ themeClass }}" style="--app-bg:#f8f9fb;--sidebar:#f3f4f6;--border:#e4e7ec;--panel:#ffffff;--panel-bd:#e4e7ec;--fg:#0f1729;--muted:#6b7686;--faint:#8a93a3;--primary:#2563eb;--soft:#eef2fe;--track:#eef0f3;--navhover:#e7e9ee;--topbar:rgba(255,255,255,.7);--activeitem:#ffffff;--activeshadow:rgba(15,23,41,.08);--colhead:#fafbfc;--bl-bg:#eef2fe;--bl-fg:#2563eb;--bl-bd:#bcd0fb;--gr-bg:#e7f7ee;--gr-fg:#15a35a;--gr-bd:#a7e3c1;--pu-bg:#f3eafe;--pu-fg:#7c3aed;--pu-bd:#d6bbf7;--am-bg:#fef5e7;--am-fg:#b6731a;--am-bd:#f0d49a;height:100vh;display:flex;background:var(--app-bg);color:var(--fg);">

  <dc-import name="JobsOxo Nav" active="scheduling" hint-size="248px,100%"></dc-import>

  <div data-screen-label="Scheduling" style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <header style="height:54px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--topbar);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:0 22px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);"><span>JobsOxo</span><span>/</span><span style="color:var(--fg);font-weight:600;">Scheduling</span></div>
      <button onClick="{{ toggleTheme }}" title="Toggle theme" style="margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
      </button>
    </header>

    <div style="flex:1;overflow-y:auto;padding:24px 26px 40px;">
      <div style="max-width:1320px;margin:0 auto;">

        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;">
          <div>
            <h2 style="margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;">Scheduling</h2>
            <p style="margin:5px 0 0;font-size:13.5px;color:var(--muted);">Week of February 2–7, 2026 · 4 crews deployed</p>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="display:flex;align-items:center;gap:2px;background:var(--track);border:1px solid var(--border);border-radius:9px;padding:3px;">
              <button style="border:none;background:none;cursor:pointer;width:30px;height:28px;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
              <span style="font-size:12.5px;font-weight:600;padding:0 8px;color:var(--fg);">This week</span>
              <button style="border:none;background:none;cursor:pointer;width:30px;height:28px;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
            </div>
            <div style="display:flex;gap:3px;background:var(--track);border:1px solid var(--border);border-radius:9px;padding:3px;">
              <button style="border:none;background:var(--panel);box-shadow:0 1px 2px rgba(15,23,41,.1);color:var(--primary);cursor:pointer;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:700;font-family:inherit;">Week</button>
              <button style="border:none;background:none;color:var(--muted);cursor:pointer;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:700;font-family:inherit;">Month</button>
            </div>
            <button style="display:flex;align-items:center;gap:7px;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 1px 2px rgba(37,99,235,.3);">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Assign crew
            </button>
          </div>
        </div>

        <!-- WEEK BOARD -->
        <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px;align-items:start;">
          <sc-for list="{{ days }}" as="day" hint-placeholder-count="6">
            <div style="background:var(--panel);border:1px solid var(--panel-bd);border-radius:12px;overflow:hidden;min-height:300px;display:flex;flex-direction:column;">
              <div style="padding:11px 13px;border-bottom:1px solid var(--border);background:{{ day.headBg }};">
                <div style="font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:{{ day.headFg }};">{{ day.weekday }}</div>
                <div class="mono" style="font-size:18px;font-weight:600;color:var(--fg);line-height:1.1;margin-top:2px;">{{ day.date }}</div>
              </div>
              <div style="padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;">
                <sc-for list="{{ day.blocks }}" as="b" hint-placeholder-count="2">
                  <a href="JobsOxo Job Detail.dc.html" class="card" style="display:block;text-decoration:none;border:1px solid {{ b.bd }};background:{{ b.bg }};border-radius:9px;padding:9px 10px;transition:all .15s;">
                    <div style="font-size:12px;font-weight:700;color:{{ b.fg }};line-height:1.25;">{{ b.job }}</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:2px;">{{ b.scope }}</div>
                    <div style="display:flex;align-items:center;gap:6px;margin-top:8px;">
                      <div style="display:flex;">
                        <sc-for list="{{ b.crew }}" as="c" hint-placeholder-count="3">
                          <div style="width:20px;height:20px;border-radius:50%;background:{{ c.bg }};color:{{ c.fg }};border:2px solid var(--panel);margin-left:-6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">{{ c.initials }}</div>
                        </sc-for>
                      </div>
                      <span style="font-size:10.5px;color:var(--faint);margin-left:2px;">{{ b.hours }}</span>
                    </div>
                  </a>
                </sc-for>
                <sc-if value="{{ day.empty }}" hint-placeholder-val="{{ false }}">
                  <div style="flex:1;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--border);border-radius:9px;color:var(--faint);font-size:11.5px;min-height:80px;">No crews</div>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>

        <!-- UNSCHEDULED BACKLOG -->
        <div style="background:var(--panel);border:1px solid var(--panel-bd);border-radius:12px;padding:16px 18px;">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:13px;">
            <span style="width:7px;height:7px;border-radius:50%;background:#e0a020;"></span>
            <span style="font-size:14.5px;font-weight:600;">Unscheduled jobs</span>
            <span style="font-size:12px;color:var(--faint);">Drag onto a day to assign a crew</span>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <sc-for list="{{ backlog }}" as="j" hint-placeholder-count="3">
              <a href="JobsOxo Job Detail.dc.html" class="card" style="display:block;text-decoration:none;border:1px solid var(--border);background:var(--track);border-radius:10px;padding:12px 14px;min-width:210px;transition:all .15s;">
                <div style="font-size:13px;font-weight:600;color:var(--fg);">{{ j.job }}</div>
                <div style="font-size:11.5px;color:var(--faint);margin-top:2px;">{{ j.meta }}</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:9px;">
                  <span style="font-size:10.5px;font-weight:700;color:var(--am-fg);background:var(--am-bg);padding:2px 8px;border-radius:6px;">Needs crew</span>
                  <span class="mono" style="font-size:11px;color:var(--muted);margin-left:auto;">{{ j.duration }}</span>
                </div>
              </a>
            </sc-for>
          </div>
        </div>

      </div>
    </div>
  </div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2563eb"/><rect x="22" y="26" width="56" height="50" rx="5" fill="#fff"/><line x1="22" y1="40" x2="78" y2="40" stroke="#2563eb" stroke-width="3"/><rect x="30" y="48" width="14" height="9" rx="2" fill="#bcd0fb"/><rect x="56" y="48" width="14" height="9" rx="2" fill="#a7e3c1"/><rect x="43" y="62" width="14" height="9" rx="2" fill="#d6bbf7"/></svg>
  </template>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1320, &quot;height&quot;: 840 },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Appearance&quot; }
}">
class Component extends DCLogic {
  state = { theme: null };
  componentDidMount() {
    try { const t = localStorage.getItem('jobsoxo-theme'); if (t) this.setState({ theme: t }); } catch (e) {}
  }
  crew(list) {
    const palette = { CF: ['#dbe3f4', '#2563eb'], MR: ['#d6f0e2', '#15a35a'], JL: ['#ece0fb', '#7c3aed'], TP: ['#fbe6d6', '#b6731a'], AV: ['#d6ecf6', '#0e7faf'], DK: ['#f6d6e4', '#b6336a'] };
    return list.map((i) => ({ initials: i, bg: (palette[i] || ['#e2e8f0', '#475569'])[0], fg: (palette[i] || ['#e2e8f0', '#475569'])[1] }));
  }
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? 'light';
    const days = [
      { weekday: 'Mon', date: 'Feb 2', headBg: 'var(--bl-bg)', headFg: 'var(--bl-fg)', blocks: [
        { job: 'Boulud', scope: 'Basement — skim', bg: 'var(--bl-bg)', fg: 'var(--bl-fg)', bd: 'var(--bl-bd)', crew: this.crew(['CF', 'MR', 'JL', 'TP']), hours: '8a–4p' }
      ] },
      { weekday: 'Tue', date: 'Feb 3', headBg: 'var(--colhead)', headFg: 'var(--faint)', blocks: [
        { job: 'Boulud', scope: 'Basement — skim', bg: 'var(--bl-bg)', fg: 'var(--bl-fg)', bd: 'var(--bl-bd)', crew: this.crew(['CF', 'MR', 'JL', 'TP']), hours: '8a–4p' }
      ] },
      { weekday: 'Wed', date: 'Feb 4', headBg: 'var(--colhead)', headFg: 'var(--faint)', blocks: [
        { job: 'Boulud', scope: 'Basement — spray', bg: 'var(--bl-bg)', fg: 'var(--bl-fg)', bd: 'var(--bl-bd)', crew: this.crew(['CF', 'MR']), hours: '8a–4p' },
        { job: 'The Vale', scope: 'Lobby repaint', bg: 'var(--gr-bg)', fg: 'var(--gr-fg)', bd: 'var(--gr-bd)', crew: this.crew(['JL', 'TP']), hours: '9a–5p' }
      ] },
      { weekday: 'Thu', date: 'Feb 5', headBg: 'var(--colhead)', headFg: 'var(--faint)', blocks: [
        { job: 'The Vale', scope: 'Lobby repaint', bg: 'var(--gr-bg)', fg: 'var(--gr-fg)', bd: 'var(--gr-bd)', crew: this.crew(['JL', 'TP']), hours: '9a–5p' },
        { job: 'Maison Pickle', scope: 'Touch-ups', bg: 'var(--pu-bg)', fg: 'var(--pu-fg)', bd: 'var(--pu-bd)', crew: this.crew(['AV']), hours: '10a–2p' }
      ] },
      { weekday: 'Fri', date: 'Feb 6', headBg: 'var(--colhead)', headFg: 'var(--faint)', blocks: [
        { job: 'Café Luxembourg', scope: 'Final coat', bg: 'var(--gr-bg)', fg: 'var(--gr-fg)', bd: 'var(--gr-bd)', crew: this.crew(['CF', 'MR', 'AV']), hours: '8a–3p' }
      ] },
      { weekday: 'Sat', date: 'Feb 7', headBg: 'var(--colhead)', headFg: 'var(--faint)', blocks: [], empty: true }
    ];
    const backlog = [
      { job: 'Tribeca Townhouse', meta: 'Interior · 2 painters needed', duration: '4 days' },
      { job: 'Brooklyn Heights Co-op', meta: 'Hallways · unassigned', duration: '3 days' },
      { job: 'The Odeon — Dining', meta: 'Walls & trim', duration: '6 days' }
    ];
    return {
      themeClass: theme === 'dark' ? 'darkmode' : '',
      toggleTheme: () => {
        const next = (this.state.theme ?? this.props.theme ?? 'light') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('jobsoxo-theme', next); } catch (e) {}
        this.setState({ theme: next });
      },
      days, backlog
    };
  }
}
</script>
</body>
</html>
