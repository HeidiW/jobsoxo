# Render Blueprint for JobsOxo. Spec: https://render.com/docs/blueprint-spec
#
# Secrets marked `sync: false` are prompted for once, when the Blueprint is
# first created in the Render Dashboard; later syncs ignore them, so add new
# ones by hand. Leave optional integrations blank until they're needed.

services:
  - type: web
    name: jobsoxo
    runtime: node
    region: virginia # Same region as the database (private network); near US East users
    plan: 0.5c-512mb # Paid plan: required for preDeployCommand. Run only 1 instance —
                     # the inbox/Plaid/reminder schedulers run in-process.
    # Dev dependencies (vite, esbuild, drizzle-kit) are needed for the build and
    # migrations, so don't set NODE_ENV=production at build time; `npm start` sets it.
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: jobsoxo-db
          property: connectionString
      - key: APP_URL # Public base URL for emails, OAuth callbacks and payment links
        fromService:
          name: jobsoxo
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_CODE # Required to create the first admin on an empty database; read it from the dashboard
        generateValue: true
      - key: ENCRYPTION_KEY # Must be 64 hex chars: `openssl rand -hex 32` (generateValue is base64)
        sync: false

      # Gusto Embedded Payroll — demo company only until live use is approved.
      - key: GUSTO_ENV
        value: demo
      - key: GUSTO_LIVE_PAYROLL_ENABLED
        value: "false"
      - key: GUSTO_CLIENT_ID
        sync: false
      - key: GUSTO_CLIENT_SECRET
        sync: false
      - key: GUSTO_WEBHOOK_SECRET
        sync: false

      # Plaid bank view (independent of payroll)
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false

      # Google sign-in, per-user Gmail and Places. Register
      # <APP_URL>/api/gmail/callback in Google Cloud Console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Other sign-in providers (optional)
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false

      # Email, SMS and payments
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM # Sender on a domain verified in Resend, e.g. noreply@jobsoxo.com
        sync: false
      - key: RESEND_WEBHOOK_SECRET # Resend → Webhooks signing secret (whsec_...), endpoint <APP_URL>/api/webhooks/resend
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

      # Invoice assistant + proofreader (Claude), via OIDC workload identity federation
      - key: ANTHROPIC_FEDERATION_RULE_ID
        sync: false
      - key: ANTHROPIC_ORGANIZATION_ID
        sync: false
      - key: ANTHROPIC_SERVICE_ACCOUNT_ID
        sync: false
      - key: ANTHROPIC_IDENTITY_TOKEN_FILE # or ANTHROPIC_IDENTITY_TOKEN
        sync: false

databases:
  - name: jobsoxo-db
    region: virginia
    plan: 0.1c-256mb # Smallest paid plan; free databases expire
    postgresMajorVersion: "16" # Matches local dev
    databaseName: jobsoxo
    ipAllowList: [] # Private network only; the web service connects internally
