<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.navitem:hover{background:var(--navhover) !important;}
.taskrow:hover{background:var(--rowhover) !important;}
.darkmode{
  --app-bg:#0f1729 !important; --sidebar:#1a2336 !important; --border:#243049 !important; --panel:#141d30 !important; --panel-bd:#243049 !important;
  --fg:#f1f5f9 !important; --muted:#9aa6bd !important; --faint:#7c8aa3 !important; --primary:#3b82f6 !important; --soft:#1c2a44 !important;
  --track:#1a2336 !important; --rowhover:#1b2740 !important; --navhover:#222e4a !important; --topbar:rgba(20,29,48,.72) !important;
  --activeitem:#222e4a !important; --activeshadow:rgba(0,0,0,.3) !important;
  --ic-red-bg:rgba(220,59,31,.18) !important; --ic-red-fg:#f1937f !important;
  --ic-amber-bg:rgba(224,160,32,.18) !important; --ic-amber-fg:#e7be73 !important;
  --ic-blue-bg:rgba(59,130,246,.18) !important; --ic-blue-fg:#93b4fb !important;
  --ic-purple-bg:rgba(124,58,237,.2) !important; --ic-purple-fg:#b794f4 !important;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#9aa3b266;border-radius:8px;border:3px solid transparent;background-clip:padding-box;}
</style>
</helmet>

<div class="{{ themeClass }}" style="--app-bg:#f8f9fb;--sidebar:#f3f4f6;--border:#e4e7ec;--panel:#ffffff;--panel-bd:#e4e7ec;--fg:#0f1729;--muted:#6b7686;--faint:#8a93a3;--primary:#2563eb;--soft:#eef2fe;--track:#eef0f3;--rowhover:#f8fafc;--navhover:#e7e9ee;--topbar:rgba(255,255,255,.7);--activeitem:#ffffff;--activeshadow:rgba(15,23,41,.08);--ic-red-bg:#fdeeec;--ic-red-fg:#d23b1f;--ic-amber-bg:#fef5e7;--ic-amber-fg:#b6731a;--ic-blue-bg:#eef2fe;--ic-blue-fg:#2563eb;--ic-purple-bg:#f3eafe;--ic-purple-fg:#7c3aed;height:100vh;display:flex;background:var(--app-bg);color:var(--fg);">

  <dc-import name="JobsOxo Nav" active="inbox" hint-size="248px,100%"></dc-import>

  <div data-screen-label="Inbox Tasks" style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <header style="height:54px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--topbar);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:0 22px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);"><span>JobsOxo</span><span>/</span><span style="color:var(--fg);font-weight:600;">Inbox Tasks</span></div>
      <button onClick="{{ toggleTheme }}" title="Toggle theme" style="margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
      </button>
    </header>

    <div style="flex:1;overflow-y:auto;padding:24px 26px 40px;">
      <div style="max-width:920px;margin:0 auto;">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;">
          <div>
            <h2 style="margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;">Inbox Tasks</h2>
            <p style="margin:5px 0 0;font-size:13.5px;color:var(--muted);">{{ openCount }} things need your attention</p>
          </div>
          <button style="background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Mark all done</button>
        </div>

        <div style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;">
          <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
            <button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }} <span style="{{ f.countStyle }}">{{ f.count }}</span></button>
          </sc-for>
        </div>

        <div style="background:var(--panel);border:1px solid var(--panel-bd);border-radius:12px;overflow:hidden;">
          <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="7">
            <div class="taskrow" style="display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);">
              <div style="width:38px;height:38px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:{{ t.iconBg }};color:{{ t.iconFg }};">{{ t.icon }}</div>
              <a href="{{ t.href }}" style="flex:1;min-width:0;text-decoration:none;color:inherit;">
                <div style="display:flex;align-items:center;gap:8px;">
                  <sc-if value="{{ t.high }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:#d23b1f;flex-shrink:0;"></span></sc-if>
                  <span style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ t.title }}</span>
                </div>
                <div style="font-size:12px;color:var(--faint);margin-top:2px;">{{ t.context }}</div>
              </a>
              <span style="font-size:11.5px;color:var(--faint);flex-shrink:0;">{{ t.age }}</span>
              <button style="flex-shrink:0;background:{{ t.btnBg }};color:{{ t.btnFg }};border:{{ t.btnBd }};border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;">{{ t.action }}</button>
            </div>
          </sc-for>
          <div style="padding:14px 18px;text-align:center;">
            <span style="font-size:12.5px;color:var(--faint);">You're caught up on everything else. 🎉</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2563eb"/><path d="M24 34h52v32a4 4 0 0 1-4 4H28a4 4 0 0 1-4-4z" fill="#fff"/><path d="M24 34l26 18 26-18" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/><circle cx="74" cy="30" r="11" fill="#fff"/><circle cx="74" cy="30" r="7" fill="#e0492f"/></svg>
  </template>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 980, &quot;height&quot;: 800 },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Appearance&quot; }
}">
class Component extends DCLogic {
  state = { theme: null, filter: 'all' };
  componentDidMount() {
    try { const t = localStorage.getItem('jobsoxo-theme'); if (t) this.setState({ theme: t }); } catch (e) {}
  }
  renderVals() {
    const theme = this.state.theme ?? this.props.theme ?? 'light';
    const filter = this.state.filter;
    const C = {
      invoice: { bg: 'var(--ic-red-bg)', fg: 'var(--ic-red-fg)', icon: '$' },
      change: { bg: 'var(--ic-amber-bg)', fg: 'var(--ic-amber-fg)', icon: '±' },
      schedule: { bg: 'var(--ic-blue-bg)', fg: 'var(--ic-blue-fg)', icon: '◷' },
      client: { bg: 'var(--ic-purple-bg)', fg: 'var(--ic-purple-fg)', icon: '☺' }
    };
    const all = [
      { type: 'invoice', title: 'JOX-1041 is 12 days overdue', context: 'The Vale Hotel · $18,600', age: '12d', high: true, action: 'Send reminder', href: 'JobsOxo Invoice Detail.dc.html', primary: true },
      { type: 'change', title: 'CO-1042-02 awaiting your approval', context: 'Boulud — add wainscoting · +$18,500', age: '2d', high: true, action: 'Review', href: 'JobsOxo Change Orders.dc.html', primary: true },
      { type: 'schedule', title: 'Tribeca Townhouse has no crew assigned', context: 'Starts Feb 9 · 2 painters needed', age: '1d', high: false, action: 'Assign crew', href: 'JobsOxo Scheduling.dc.html', primary: false },
      { type: 'invoice', title: 'Café Luxembourg balance due today', context: 'JOX-1040 · $12,000 · partially paid', age: '0d', high: false, action: 'Send reminder', href: 'JobsOxo Invoice Detail.dc.html', primary: false },
      { type: 'change', title: 'CO-1031-01 awaiting your approval', context: 'The Vale — additional coat · +$3,300', age: '3d', high: false, action: 'Review', href: 'JobsOxo Change Orders.dc.html', primary: false },
      { type: 'client', title: 'New client request from The Odeon', context: 'Dining room repaint · estimate requested', age: '4d', high: false, action: 'View', href: 'JobsOxo Clients.dc.html', primary: false },
      { type: 'invoice', title: 'JOX-1038 is still a draft', context: 'Gramercy Residence · $6,400', age: '6d', high: false, action: 'Finish & send', href: 'JobsOxo Create Invoice.dc.html', primary: false }
    ];
    const counts = {
      all: all.length,
      invoice: all.filter((t) => t.type === 'invoice').length,
      change: all.filter((t) => t.type === 'change').length,
      schedule: all.filter((t) => t.type === 'schedule').length,
      client: all.filter((t) => t.type === 'client').length
    };
    const filterDefs = [
      { key: 'all', label: 'All' }, { key: 'invoice', label: 'Invoices' },
      { key: 'change', label: 'Change orders' }, { key: 'schedule', label: 'Scheduling' }, { key: 'client', label: 'Clients' }
    ];
    const filters = filterDefs.map((f) => {
      const active = filter === f.key;
      return {
        label: f.label, count: counts[f.key], onClick: () => this.setState({ filter: f.key }),
        style: { display: 'inline-flex', alignItems: 'center', gap: '7px', cursor: 'pointer', fontFamily: 'inherit', fontSize: '13px', fontWeight: 600, padding: '7px 13px', borderRadius: '8px', border: '1px solid ' + (active ? 'transparent' : 'var(--border)'), background: active ? 'var(--primary)' : 'var(--panel)', color: active ? '#fff' : 'var(--muted)' },
        countStyle: { fontFamily: "'IBM Plex Mono', monospace", fontSize: '11px', fontWeight: 600, padding: '0px 6px', borderRadius: '5px', background: active ? 'rgba(255,255,255,.22)' : 'var(--track)', color: active ? '#fff' : 'var(--faint)' }
      };
    });
    const tasks = all.filter((t) => filter === 'all' || t.type === filter).map((t) => {
      const c = C[t.type];
      return {
        ...t, iconBg: c.bg, iconFg: c.fg, icon: c.icon,
        btnBg: t.primary ? 'var(--primary)' : 'var(--panel)',
        btnFg: t.primary ? '#fff' : 'var(--fg)',
        btnBd: t.primary ? 'none' : '1px solid var(--border)'
      };
    });
    return {
      themeClass: theme === 'dark' ? 'darkmode' : '',
      toggleTheme: () => {
        const next = (this.state.theme ?? this.props.theme ?? 'light') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('jobsoxo-theme', next); } catch (e) {}
        this.setState({ theme: next });
      },
      filters, tasks, openCount: all.length
    };
  }
}
</script>
</body>
</html>
